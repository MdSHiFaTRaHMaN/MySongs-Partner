# Nginx Production Configuration for myownsongs.cloud
# Place in: /etc/nginx/sites-available/myownsongs.cloud
# Symlink: ln -s /etc/nginx/sites-available/myownsongs.cloud /etc/nginx/sites-enabled/
# Reload: sudo nginx -t && sudo nginx -s reload

upstream nextjs_backend {
    least_conn; # Route incoming requests to the least busy PM2 cluster worker
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64; # Maintain persistent connection pool to backend
}

server {
    listen 80;
    listen [::]:80;
    server_name myownsongs.cloud www.myownsongs.cloud;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myownsongs.cloud www.myownsongs.cloud;

    # SSL Configuration (Certbot / Let's Encrypt or Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/myownsongs.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myownsongs.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Performance & Payload Limits
    client_max_body_size 50M;
    client_body_buffer_size 256k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Caching (Next.js & Widgets)
    location /_next/static/ {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg)$ {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Dynamic Next.js Application & API Endpoints
    location / {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        
        # Proxy Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for Long-Running AI/Audio operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}

